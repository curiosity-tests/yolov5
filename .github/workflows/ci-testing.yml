# YOLOv5 Continuous Integration (CI) GitHub Actions tests

name: YOLOv5 CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
  - cron: "0 0 * * *"   # runs at 00:00 UTC every day
  workflow_dispatch:
    inputs:
      leg:
        description: baseline (uninstrumented) or instrumented (under chalk/curiosity)
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "YOLOv5 CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  Benchmarks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"] # requires python<=3.11
        model: [yolov5n]
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: ultralytics/actions/setup-uv@main
    - name: Install requirements
      run: |
        uv pip install --system -r requirements.txt coremltools "openvino>=2024.0.0" "tensorflow<=2.19.0" "keras>=3.5.0,<=3.12.0" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
        yolo checks
        uv pip list
    - name: Benchmark DetectionModel
      run: |
        python benchmarks.py --data coco128.yaml --weights ${{ matrix.model }}.pt --img 320 --hard-fail 0.29
    - name: Benchmark SegmentationModel
      run: |
        python benchmarks.py --data coco128-seg.yaml --weights ${{ matrix.model }}-seg.pt --img 320 --hard-fail 0.22
    - name: Test predictions
      run: |
        python export.py --weights ${{ matrix.model }}-cls.pt --include onnx --img 224
        python detect.py --weights ${{ matrix.model }}.onnx --img 320
        python segment/predict.py --weights ${{ matrix.model }}-seg.onnx --img 320
        python classify/predict.py --weights ${{ matrix.model }}-cls.onnx --img 224

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  Tests:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # macos-latest bug https://github.com/ultralytics/yolov5/pull/9049
        python-version: ["3.x"] # evergreen latest stable Python
        model: [yolov5n]
        include:
        - os: ubuntu-latest
          python-version: "3.8"   # repo minimum Python, paired with minimum torch 1.8.0
          model: yolov5n
          torch: "1.8.0"   # min torch version CI https://pypi.org/project/torchvision/
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: ultralytics/actions/setup-uv@main
    - name: Install requirements
      run: |
        torch=""
        if [ "${{ matrix.torch }}" == "1.8.0" ]; then
          torch="torch==1.8.0 torchvision==0.9.0"
        fi
        uv pip install --system -r requirements.txt $torch --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      shell: bash   # for Windows compatibility
    - name: Update macOS security policy
      if: runner.os == 'macOS'
      run: | # fix occasional torch multiprocessing failure
        xattr -dr com.apple.quarantine "$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")"
        chmod +x "$(python -c "import torch; print(torch.__file__.replace('__init__.py', 'bin/torch_shm_manager'))")"
    - name: Check environment
      run: |
        yolo checks
        pip list
    - name: Test detection
      shell: bash   # for Windows compatibility
      run: |
        # export PYTHONPATH="$PWD"  # to run '$ python *.py' files in subdirectories
        m=${{ matrix.model }}  # official weights
        b=runs/train/exp/weights/best  # best.pt checkpoint
        python train.py --imgsz 64 --batch 32 --weights $m.pt --cfg $m.yaml --epochs 1 --device cpu  # train
        for d in cpu; do  # devices
          for w in $m $b; do  # weights
            python val.py --imgsz 64 --batch 32 --weights "$w.pt" --device $d  # val
            python detect.py --imgsz 64 --weights "$w.pt" --device $d  # detect
          done
        done
        python hubconf.py --model $m  # hub
        # python models/tf.py --weights $m.pt  # build TF model
        python models/yolo.py --cfg $m.yaml  # build PyTorch model
        python export.py --weights $m.pt --img 64 --include torchscript  # export
        python - <<EOF
        import torch
        im = torch.zeros([1, 3, 64, 64])
        for path in '$m', '$b':
            model = torch.hub.load('.', 'custom', path=path, source='local')
            print(model('data/images/bus.jpg'))
            model(im)  # warmup, build grids for trace
            torch.jit.trace(model, [im])
        EOF
    - name: Test segmentation
      shell: bash   # for Windows compatibility
      run: |
        m=${{ matrix.model }}-seg  # official weights
        b=runs/train-seg/exp/weights/best  # best.pt checkpoint
        python segment/train.py --imgsz 64 --batch 32 --weights $m.pt --cfg $m.yaml --epochs 1 --device cpu  # train
        python segment/train.py --imgsz 64 --batch 32 --weights '' --cfg $m.yaml --epochs 1 --device cpu  # train
        for d in cpu; do  # devices
          for w in $m $b; do  # weights
            python segment/val.py --imgsz 64 --batch 32 --weights "$w.pt" --device $d  # val
            python segment/predict.py --imgsz 64 --weights "$w.pt" --device $d  # predict
            python export.py --weights "$w.pt" --img 64 --include torchscript --device $d  # export
          done
        done
    - name: Test classification
      shell: bash   # for Windows compatibility
      run: |
        m=${{ matrix.model }}-cls.pt  # official weights
        b=runs/train-cls/exp/weights/best.pt  # best.pt checkpoint
        python classify/train.py --imgsz 32 --model $m --data mnist160 --epochs 1  # train
        python classify/val.py --imgsz 32 --weights $b --data ../datasets/mnist160  # val
        python classify/predict.py --imgsz 32 --weights $b --source ../datasets/mnist160/test/7/60.png  # predict
        python classify/predict.py --imgsz 32 --weights $m --source data/images/bus.jpg  # predict
        python export.py --weights $b --img 64 --include torchscript  # export
        python - <<EOF
        import torch
        for path in '$m', '$b':
            model = torch.hub.load('.', 'custom', path=path, source='local')
        EOF

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
